apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imajev-model-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imajev-adapters
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imajev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: imajev
  template:
    metadata:
      labels:
        app: imajev
    spec:
      nodeSelector:
        gpu-pool-size: small
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: imajev
          image: quay.io/rh_ee_taagarwa/imajev:amd64
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-cache
              mountPath: /app/imajev/.cache/huggingface
            - name: adapters
              mountPath: /app/imajev/adapters
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: imajev-model-cache
        - name: adapters
          persistentVolumeClaim:
            claimName: imajev-adapters
---
apiVersion: v1
kind: Service
metadata:
  name: imajev
spec:
  selector:
    app: imajev
  ports:
    - name: http
      port: 8765
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: imajev
spec:
  to:
    kind: Service
    name: imajev
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
